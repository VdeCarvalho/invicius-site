<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Compare monthly payments across multiple loans, with payment smoothing and a complete repayment schedule.">
  <title>Loan Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=17">

  <script defer src="i18n.js?v=17"></script>
  <script defer src="finance.js?v=17"></script>
  <script defer src="pdf.js?v=17"></script>
  <script defer src="excel.js?v=17"></script>
  <script defer src="app.js?v=17"></script>
</head>
<body>
  <div id="app"></div>

  <noscript>
    This calculator requires JavaScript. / Esta calculadora precisa de JavaScript.
  </noscript>

  <script>
    // V19: one down payment for the complete group of loans.
    window.addEventListener('DOMContentLoaded', () => {
      const labels = {
        en:'Down payment', zh:'首付款', hi:'अग्रिम भुगतान',
        es:'Pago inicial', ar:'الدفعة المقدمة', fr:'Apport personnel',
        ru:'Первоначальный взнос', bn:'ডাউন পেমেন্ট', pt:'Entrada',
        id:'Uang muka', ur:'پیشگی ادائیگی'
      };
      const hints = {
        en:'Deducted once from the total, proportionally across the loans.',
        pt:'Descontada uma única vez do total, proporcionalmente entre os empréstimos.',
        fr:'Déduit une seule fois du total, proportionnellement entre les prêts.',
        es:'Se descuenta una sola vez del total, proporcionalmente entre los préstamos.'
      };
      const label = () => labels[state.lang] || labels.en;
      state.downPayment = '';
      function value(raw) {
        if (!String(raw ?? '').trim()) return 0;
        const normalized = numeric(String(raw));
        if (!/^\d+(?:\.\d{1,2})?$/.test(normalized)) throw Error('invalidSolver');
        const amount = Number(normalized);
        if (!Number.isFinite(amount) || amount < 0 || amount > 1e12) throw Error('invalidSolver');
        return amount;
      }
      function deduct(loans, raw) {
        const payment = value(raw);
        if (!payment) return loans;
        const amounts = loans.map(loan => Number(numeric(String(loan.amount))));
        const total = amounts.reduce((sum, amount) => sum + amount, 0);
        if (amounts.some(amount => !Number.isFinite(amount) || amount <= 0) || payment >= total)
          throw Error('invalidSolver');
        return loans.map((loan, index) => ({...loan, amount:String(amounts[index] * (1 - payment / total))}));
      }
      const basePrepared = prepared;
      prepared = function () {
        const loans = basePrepared();
        return state.target === 'amount' ? loans : deduct(loans, state.downPayment);
      };
      const baseRender = render;
      render = function () {
        baseRender();
        if (state.target === 'amount') return;
        document.querySelector('#add-loan').insertAdjacentHTML('afterend', `
          <div class="payment-field" id="down-payment-section">
            <label for="down-payment">${label()}</label>
            <div class="amount-wrap">
              <input id="down-payment" type="text" inputmode="decimal"
                value="${escapeHTML(state.downPayment)}" placeholder="0" autocomplete="off">
              <span class="currency-tag">${state.currency}</span>
            </div>
            <p class="hint">${hints[state.lang] || hints.en}</p>
          </div>`);
      };
      document.addEventListener('input', event => {
        if (event.target.id !== 'down-payment') return;
        state.downPayment = event.target.value;
        invalidate();
      });
      const basePdf = pdfReport;
      pdfReport = function () {
        const report = basePdf();
        if (state.target !== 'amount') report.summary.push([label(), money(value(state.downPayment))]);
        return report;
      };
      const baseExcel = LoanExcel.download.bind(LoanExcel);
      LoanExcel.download = async function (exportState, words, math) {
        if (exportState.target === 'amount') return baseExcel(exportState, words, math);
        return baseExcel({...exportState, loans:deduct(exportState.loans, exportState.downPayment)}, words, math);
      };
      render();
    });
  </script>
</body>
</html>
